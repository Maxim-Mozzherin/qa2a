name: QA2A Continuous Integration

on:
  push:
    branches: [  main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Test iiko_parser
        run: |
          cd iiko_parser
          go test -v ./...

      - name: Build iiko_parser
        run: |
          cd iiko_parser
          go build -v -o /tmp/iiko_parser .

      - name: Test qa2a_reboot
        run: |
          cd qa2a-reboot
          go test -v ./...

      - name: Build qa2a_reboot
        run: |
          cd qa2a-reboot
          go build -v -o /tmp/qa2a ./cmd/api

